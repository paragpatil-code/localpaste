<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LocalPaste</title>
<style>
:root{color-scheme:light dark;--bg:#f5f6f8;--card:#fff;--fg:#1b1d21;--mut:#6b7280;--bd:#d9dce1;--acc:#2563eb;--red:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--card:#1c1e23;--fg:#e8e9ec;--mut:#9aa0a8;--bd:#34373e;--acc:#4f8cff;--red:#f26d6d}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
textarea{display:block;width:100%;min-height:130px;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:inherit;font:14px/1.45 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.row{display:flex;gap:8px;align-items:center;margin:10px 0 18px}
.sp{flex:1}
button{font:inherit;font-size:14px;padding:8px 14px;min-height:38px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:inherit;cursor:pointer}
button:active{opacity:.7}
.primary{background:var(--acc);border-color:var(--acc);color:#fff;padding:8px 22px}
.danger{color:var(--red)}
#st{color:var(--mut);font-size:13px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.item pre{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
.meta{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:12px}
.empty{color:var(--mut);text-align:center;padding:28px 0}
</style>
</head>
<body>
<main>
  <h1>LocalPaste</h1>
  <textarea id="text" placeholder="Paste text here…  (Ctrl+Enter to save)"></textarea>
  <div class="row">
    <button class="primary" id="save">Save</button>
    <span id="st"></span>
    <span class="sp"></span>
    <button class="danger" id="clear">Clear all</button>
  </div>
  <div id="list"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const text = $('text'), list = $('list'), st = $('st');
let shown = null, stTimer;

function status(msg) {
  st.textContent = msg;
  clearTimeout(stTimer);
  stTimer = setTimeout(() => st.textContent = '', 2500);
}

async function api(method, path = '', body) {
  const opts = { method, cache: 'no-store' };
  if (body !== undefined) {
    opts.headers = { 'Content-Type': 'application/json; charset=utf-8' };
    opts.body = JSON.stringify(body);
  }
  const r = await fetch('/api/pastes' + path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'HTTP ' + r.status);
  return data;
}

async function load() {
  try { render(await api('GET')); }
  catch (e) { status('Server unreachable'); }
}

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}

function render(items) {
  const key = JSON.stringify(items);
  if (key === shown) return; // don't disturb text selection when nothing changed
  shown = key;
  list.textContent = '';
  if (!items.length) { list.appendChild(el('div', 'empty', 'No pastes yet')); return; }
  for (const p of items) {
    const item = el('div', 'item');
    const pre = el('pre', '', p.text);
    const meta = el('div', 'meta');
    meta.appendChild(el('span', '', new Date(p.time).toLocaleString()));
    meta.appendChild(el('span', 'sp'));
    const copyBtn = el('button', '', 'Copy');
    copyBtn.onclick = () => copy(p.text, pre);
    const delBtn = el('button', 'danger', 'Delete');
    delBtn.onclick = () => run(() => api('DELETE', '/' + p.id), 'Deleted');
    meta.append(copyBtn, delBtn);
    item.append(pre, meta);
    list.appendChild(item);
  }
}

async function run(action, okMsg) {
  try { await action(); status(okMsg); }
  catch (e) { status('Error: ' + e.message); }
  load();
}

// navigator.clipboard only exists on HTTPS/localhost, so plain-HTTP pages use execCommand.
async function copy(str, pre) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(str); return status('Copied'); } catch (e) {}
  }
  const ta = document.createElement('textarea');
  ta.value = str;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, str.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  if (ok) return status('Copied');
  // Last resort: select the text so the user can copy it manually.
  const range = document.createRange();
  range.selectNodeContents(pre);
  const sel = getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  status('Press Ctrl+C / long-press to copy');
}

function save() {
  const v = text.value;
  if (!v.trim()) return text.focus();
  run(async () => { await api('POST', '', { text: v }); text.value = ''; }, 'Saved');
}

$('save').onclick = save;
text.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) save(); });
$('clear').onclick = () => { if (confirm('Delete all pastes?')) run(() => api('DELETE'), 'Cleared'); };

// Poll only while the tab is visible, so a forgotten background tab lets the server idle out.
setInterval(() => { if (!document.hidden) load(); }, 3000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
load();
</script>
</body>
</html>
